[tool.ruff]
# Target Python 3.12+ syntax (3.14 is compatible)
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Enable: pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B),
# pep8-naming (N), annotations (ANN), type-checking (TCH)
select = ["E", "W", "F", "I", "B", "N", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Pydantic plugin options
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:jose.*:",
    "ignore::DeprecationWarning:starlette.*:",
    "ignore::DeprecationWarning:httpx.*:",
]

# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

