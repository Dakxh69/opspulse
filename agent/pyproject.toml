[tool.ruff]
target-version = "py312"
line-length = 100
src = ["opspulse_agent", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP"]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["opspulse_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

