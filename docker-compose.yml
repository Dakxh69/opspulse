# OpsPulse — Docker Compose
# Local development orchestration.
# Production hardening (secrets, TLS, resource limits) is a Day 28 task.
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # stream all logs
#   docker compose down -v        # stop and remove volumes (data loss!)
#   docker compose down           # stop, preserve volumes

services:

  # ===========================================================================
  # PostgreSQL — primary database
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: opspulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspulse}
      POSTGRES_USER: ${POSTGRES_USER:-opspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspulse} -d ${POSTGRES_DB:-opspulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # Redis — message broker for Celery + refresh token revocation
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: opspulse-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # FastAPI Backend — REST API + WebSocket gateway
  # (Implemented from Day 2 onwards; placeholder until Dockerfile exists)
