name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # =============================================================================
  # Backend: lint, type check, unit tests
  # =============================================================================
  backend-lint-and-test:
    name: Backend — Lint, Type Check, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opspulse_test
          POSTGRES_USER: opspulse
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspulse -d opspulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv --upgrade-deps
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check app/ tests/

      - name: Format check with ruff
        run: |
          source .venv/bin/activate
          ruff format --check app/ tests/

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          mypy app/
        # Allow mypy failures as warnings until all stubs are in place
        continue-on-error: true

      - name: Run database migrations
        run: |
          source .venv/bin/activate
          alembic upgrade head
        env:
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "opspulse_test"
          POSTGRES_USER: "opspulse"
          POSTGRES_PASSWORD: "testpassword"

      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short
        env:
          DEBUG: "true"
          SECRET_KEY: "test-secret-key-at-least-32-chars-long"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "opspulse_test"
          POSTGRES_USER: "opspulse"
          POSTGRES_PASSWORD: "testpassword"
          REDIS_URL: "redis://localhost:6379/0"

  # =============================================================================
  # Agent: lint, type check, unit tests (Phase 2)
  # =============================================================================
  agent-lint-and-test:
    name: Agent — Lint, Type Check, Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv --upgrade-deps
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check opspulse_agent/ tests/

      - name: Format check with ruff
        run: |
          source .venv/bin/activate
          ruff format --check opspulse_agent/ tests/

      - name: Type check with mypy
        run: |
          source .venv/bin/activate
          mypy opspulse_agent/ tests/

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short

  # =============================================================================
  # Frontend: lint, type check, unit tests (Day 18+ when frontend code exists)
